<script>"use strict";

var PREF = [ "北海道", "青森県", "岩手県", "宮城県", "秋田県", "山形県", "福島県", "茨城県", "栃木県", "群馬県", "埼玉県", "千葉県", "東京都", "神奈川県", "新潟県", "富山県", "石川県", "福井県", "山梨県", "長野県", "岐阜県", "静岡県", "愛知県", "三重県", "滋賀県", "京都府", "大阪府", "兵庫県", "奈良県", "和歌山県", "鳥取県", "島根県", "岡山県", "広島県", "山口県", "徳島県", "香川県", "愛媛県", "高知県", "福岡県", "佐賀県", "長崎県", "熊本県", "大分県", "宮崎県", "鹿児島県", "沖縄県" ];

var PREF_DOMAIN = [ ".hokkaido.jp", ".nagano.jp", ".fukushima.jp", ".shizuoka.jp", ".saitama.jp", ".chiba.jp", ".tokyo.jp", ".okinawa.jp", ".kanagawa.jp", ".nara.jp", ".iwate.jp", ".fukuoka.jp", ".miyagi.jp", ".gunma.jp", ".osaka.jp", ".yamagata.jp", ".aichi.jp", ".niigata.jp", ".yamanashi.jp", ".kochi.jp", ".kumamoto.jp", ".okayama.jp", ".akita.jp", ".gifu.jp", ".mie.jp", ".ehime.jp", ".hyogo.jp", ".wakayama.jp", ".kyoto.jp", ".hiroshima.jp", ".tochigi.jp", ".toyama.jp", ".aomori.jp", ".ibaraki.jp", ".oita.jp", ".miyazaki.jp", ".shiga.jp", ".kagoshima.jp", ".nagasaki.jp", ".ishikawa.jp", ".kagawa.jp", ".shimane.jp", ".fukui.jp", ".tokushima.jp", ".saga.jp", ".tottori.jp", ".yamaguchi.jp" ];

window.onload = function() {
	var data = {};
	var sum = 0;
	var list = LOCALGOV_JP;
	
	var parseDomain = function(url) {
		var s = url;
		s = url.substring(s.indexOf("://") + 3);
		var n = s.indexOf('/');
		if (n < 0)
			n = s.length;
		s = s.substring(0, n);
		if (s.endsWith(".jp")) {
			n = s.lastIndexOf('.', s.length - 4);
			s = s.substring(n);
			if (
				s == ".ne.jp" ||
				s == ".or.jp" ||
				s == ".lg.jp" ||
				s == ".gr.jp"
			) {
				return s;
			}
			for (var i = 0; i < PREF_DOMAIN.length; i++)
				if (PREF_DOMAIN[i] == s)
					return "[pref].jp";
			return ".jp";
		}
		n = s.lastIndexOf('.');
		return s.substring(n);
	};
	
	for (var i = 0; i < list.length; i++) {
		var g = list[i];
		var domain = parseDomain(g.url);
		
		if (data[domain]) {
			data[domain]++;
		} else {
			data[domain] = 1;
		}
		sum++;
	}
//		dump(data);
	showCircleGraph(get("canvas"), { data: data, unit: "" });
	showTable(get("tbl"), { data: data, unit: "" });
	get("num").textContent = sum
	
	govlist.appendChild(toTable(list));
};

var showTable = function(div, gdata) {
	var data = gdata.data;
	var unit = gdata.unit;
	var d = [];
	var sum = 0;
	for (var n in data) {
		d.push([ n, data[n] ]);
		sum += data[n];
	}
	d = d.sort(function(a, b) {
		if (a[1] < b[1])
			return 1;
		if (a[1] == b[1])
			return 0;
		return -1;
	});
	
	d.push([ "合計", sum ]);
	var tbl = create("table");
	for (var i = 0; i < d.length; i++) {
		var tr = create("tr");
		var td = create("td");
		var s = d[i][0];
		if (s.startsWith("http://") || s.startsWith("https://")) {
			td.innerHTML = "<a href=" + s + " target=_blank>" + s + "</a>";
		} else {
			td.textContent = s;
			td.style.cursor = "hannd";
			td.onclick = function() {
				var name = this.textContent;
				var s = name + "\n";
				for (var i = 0; i < AREA.length; i++) {
					var area = AREA[i];
					if (area[0] == name) {
						for (var j = 1; j < area.length; j++) {
							s += area[j] + " ";
						}
					}
				}
				alert(s);
			};
		}
		tr.appendChild(td);
		td = create("td");
		td.textContent = d[i][1] + unit;
		tr.appendChild(td);
		td = create("td");
		td.textContent = fixfloat(d[i][1] / sum * 100, 1) + "%";
		tr.appendChild(td);
		tbl.appendChild(tr);
	}
	div.appendChild(tbl);
};
var showCircleGraph = function(c, gdata) {
	var data = gdata.data;
	var unit = gdata.unit;
	var g = getContext(c);
	var d = [];
	var sum = 0;
	for (var n in data) {
		d.push([ n, data[n] ]);
		sum += data[n];
	}
//	alert(sum);
	
	d = d.sort(function(a, b) {
		if (a[0] == "その他")
			return 1;
		if (b[0] == "その他")
			return -1;
		if (a[1] < b[1])
			return 1;
		if (a[1] == b[1])
			return 0;
		return -1;
	});
//	dump(d);
	g.setFont = function(sh) {
		this.font = "normal " + sh + "px sans-serif";
	};
	g.fillTextCenter = function(s, x, y) {
		var met = this.measureText(s);
		var sw = met.width;
		this.fillText(s, x - sw / 2, y);
	};
	var timer = null;
	
	var animation = function(t, type) {
		switch (type) {
			case 0:
				return t * t;
			case 1:
				return 1 - (1 - t) * (1 - t);
			default:
				return t;
		}
		return t;
	};
	
	var t = 0;
	g.draw = function() {
		g.setColor(255, 255, 255);
		g.fillRect(0, 0, g.cw, g.ch);
		
		var cx = g.cw / 2;
		var cy = g.ch / 2;
		var r = Math.min(g.cw, g.ch) / 2 * .95;
		
		var max = Math.PI * 2 * animation(t / 100, 1);
		var f = function(dx, dy, s, v) {
			g.translate(dx, dy);
			var th = -Math.PI / 2;
			for (var i = 0; i < d.length; i++) {
				var dth = d[i][1] / sum * max;
				var col = hsv2rgb(120 + 360 / d.length * i, s, v);
				g.setColor(col[0], col[1], col[2]);
				g.beginPath();
				g.moveTo(cx, cy);
				g.arc(cx, cy, r, th, th + dth, false);
				g.lineTo(cx, cy);
				g.closePath();
				g.fill();
				th += dth;
			}
			g.translate(-dx, -dy);
		};
		f(8, 8, .6, .5);
		f(0, 0, .6, 1);

		var fh = 10;
		g.setFont(fh);
//		g.setColor(255, 255, 255);
		g.setColor(0, 0, 0);
		var th = -Math.PI / 2;
		for (var i = 0; i < d.length; i++) {
			var dth = d[i][1] / sum * max;
			var x = cx + Math.cos(th + dth / 2) * r * .7;
			var y = cy + Math.sin(th + dth / 2) * r * .7;
			g.fillTextCenter(d[i][0], x, y - fh / 6);
			g.fillTextCenter(addComma(d[i][1]) + unit, x, y + fh + fh / 6);
			g.fillTextCenter(fixfloat(d[i][1] / sum * 100, 1) + "%", x, y + fh * 2 + fh / 6);
			th += dth;
		}
		g.fillTextCenter("総数", cx, cy - fh / 6);
		g.fillTextCenter(addComma(sum) + unit, cx, cy + fh + fh / 6);
		if (t >= 100) {
			clearInterval(timer);
		}
	};
	g.init();
	if (timer)
		clearInterval(timer);
	timer = setInterval(function() {
		g.draw();
		t++;
	}, 20);
};
var toTable = function(array) {
	var deco = function(s) {
		if (s.startsWith("http://") || s.startsWith("https://")) {
			return "<a href=" + s + " target=_blank>" + s + "</a>";
		}
		return s;
	};
	var tbl = create("table");
	for (var i = 0; i < array.length; i++) {
		var dd = array[i];
		var tr = create("tr");
		if (Array.isArray(dd)) {
			for (var j = 0; j < dd.length; j++) {
				var td = create("td");
				td.innerHTML = deco(dd[j]);
				tr.appendChild(td);
			}
		} else {
			for (var j in dd) {
				var td = create("td");
				td.innerHTML = deco(dd[j]);
				tr.appendChild(td);
			}
		}
		tbl.appendChild(tr);
	}
	return tbl;
};
