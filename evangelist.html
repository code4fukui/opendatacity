<script>"use strict"
window.onload = async function() {
	const key = '2PACX-1vTZ7GCTX0FFGIIaU3Sty2r9jZ1n4UMX02KU10C57oxuTc_dNhHn7VPDhMGF9Nr6Ffs5IK2G4GuFACOk'
	const data = await fetchGoogleSpreadSheet(key)
	
	const items = []
	let bkkey = null
	const show = function() {
		const key = searchbox.value
		if (bkkey == key)
			return
		bkkey = key
		clear(main)
		document.location.hash = '#' + encodeURIComponent(key)
	/*
		https://schema.org/identifier: "1"
		http://xmlns.com/foaf/0.1/#name: "丸田 之人"
		name_yomi: "まるた ゆきと"
		http://xmlns.com/foaf/0.1/#based_near: "北海道"
		https://schema.org/description: "室蘭市役所職員として、北海道を拠点にオープンデータ施策や活用を積極的に推進。また、シンクライアントシステムや庁内ネットワーク等の構築も実施。"
		organization: "室蘭市役所"
	*/
		for (const d of data) {
			if (key) {
				let flg = false
				for (const name in d) {
					if (d[name].indexOf(key) >= 0) {
						flg = true
						break
					}
				}
				if (!flg)
					continue
			}
			const div = create('div')
			div.className = "item"
			div.innerHTML = `
				<h2><ruby>${d['http://xmlns.com/foaf/0.1/#name']}<rt>${d['name_yomi']}</rt></ruby></h2>
				<div class=area>${d['http://xmlns.com/foaf/0.1/#based_near']}</div>
				<div class=description>${d['https://schema.org/description']}</div>
				<div class=id>所属 ${d['organization']}</div>
				<div class=id>オープンデータ伝道師ID： ${d['https://schema.org/identifier']}</div>
			`
			div.querySelector('.area').onclick = function() {
				searchbox.value = d['http://xmlns.com/foaf/0.1/#based_near']
				show()
			}
			main.appendChild(div)
		}
	}
	searchbox.onkeyup = searchbox.onchange = show
	btnclear.onclick = function() {
		searchbox.value = ''
		show()
	}
	if (document.location.hash.length > 1) {
		searchbox.value = decodeURIComponent(document.location.hash.substring(1))
	}

	show()
}
</script>
