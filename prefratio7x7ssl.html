<script>"use strict"

const getLocalGovCity = function(callback) {
	callback(LOCALGOV_JP)
}
window.onload = function() {
	getLocalGovCity(function(govs) {
		init(govs)
	})
}

let databk

const init = govs => {
	get("japan").innerHTML += makeJapanHTML()
	
//	dump(data);
	
	databk = govs
	
	init2014()
}
var compareKana = function(a, b) {
	a = katakanaToHiragana(a.toString())
	b = katakanaToHiragana(b.toString())
	if (a < b) {
		return -1
	} else if (a > b) {
		return 1
	}
	return 0
}
// https://gist.github.com/kawanet/5553478
/** カタカナをひらがなに変換する関数
 * @param {String} src - カタカナ
 * @returns {String} - ひらがな
 */
const katakanaToHiragana = function(src) {
	return src.replace(/[\u30a1-\u30f6]/g, function(match) {
		var chr = match.charCodeAt(0) - 0x60
		return String.fromCharCode(chr)
	})
}
const init2014 = async () => {
	let data = databk
	// console.log(data)
	//return
	const prefdata = await (await fetch("https://code4fukui.github.io/localgovjp/prefjp.json")).json();
	console.log(prefdata);

	const countPref = function(pref) {
		let cnt = 1; // + 都道府県
		/*
		for (let i = 0; i < data.length; i++) {
			const p = data[i].pref
			if (p.startsWith(pref)) {
				const c = data[i].city
				cnt++
			}
		}
		*/
		return cnt
	}
	const countPrefSSL = function(pref) {
		let cnt = 0;
		if (prefdata.find(d => d.pref == pref).url.startsWith("https://"))
			cnt++;
		/*
		for (let i = 0; i < data.length; i++) {
			const p = data[i].pref;
			if (p.startsWith(pref)) {
				const c = data[i].url;
				if (c.startsWith("https://"))
					cnt++;
			}
		}
		*/
		return cnt
	}
//	dump(data);

	const getContentPref = function(pref) {
		let d2 = [];
		const p = prefdata.find(d => d.pref === pref);
		for (let i = 0; i < data.length; i++) {
			const dd = data[i]
			if (dd.pref.startsWith(pref)) {
				const url = dd.url
				// const desc = dd.phrase
				//if (pref.startsWith("東京都") || !dd.city.endsWith("区"))
					d2.push([ url, dd.city, dd.citykana ]);
			}
		}
		d2.sort(function(n, m) {
			return compareKana(n[2], m[2])
		})
		d2.unshift([p.url, p.pref, p.prefkana]);
		let s = []
		for (let i = 0; i < d2.length; i++) {
			const d3 = d2[i];
			if (d3[0].startsWith("https://")) {
				s.push("<a href=" + d3[0] + " class=ssl><ruby>" + d3[1] + "<rt>" + d3[2] + "</rt></ruby></a>")
			} else {
				s.push("<a href=" + d3[0] + " class=nossl>x <ruby>" + d3[1] + "<rt>" + d3[2] + "</rt></ruby></a>")
			}
		}
		return s.join(", ")
	}
	let sum = 0
	let sumodc = 0
	for (let i = 1; i <= 47; i++) {
		const c = get("jp" + i)
		c.num = i - 1
		c.onclick = function() {
			this.sel()
		}
		const cnt = countPref(PREF[i - 1])
		sum += cnt;
		let cntod = countPrefSSL(PREF[i - 1])
		sumodc += cntod;
		const r = cntod / cnt
		//c.innerHTML += "<br>" + Math.floor(100 * r) + "%"
		// c.style.background = "rgba(10,120,130," + ((r - .4) / .4) + ")"
		if (r === 0) {
			c.style.background = "rgb(220,20,30)";
		} else {
			c.style.background = "rgb(100,150,230)";
		}
		c.style.color = "white"; //r < .5 ? "black" : "white"
		c.cnt = cnt
		c.cntod = cntod
		
		c.sel = function() {
			var pref = PREF[this.num]
			/*
			var od = getCityOpenData(pref, "")
			if (od) {
				pref = "<a href=" + od + ">" + pref + "</a>"
			}
			*/
			get("box").innerHTML = pref + "（" + this.cntod + " / " + this.cnt + "）：" + getContentPref(PREF[this.num])
		}
	}
	
	let s = ''
	s += "都道府県AOSSL取組率 " + fixfloat(sumodc / sum * 100, 1) + "% （" + sumodc + "都道府県）<br>";
	s += "日本の都道府県数：" + sum + "<br>"
	get("box").innerHTML = s
	const sjpall = s
	jpall.onclick = function() {
		box.innerHTML = sjpall
	}
	var r = sumodc / sum;
	jpall.innerHTML = "都道府県AOSSL取組率<br>" + Math.floor(r * 100) + "%"
	jpall.style.fontSize = "1.7vw"
	//jpall.style.background = "rgba(30,230,10," + r + ")"
	jpall.style.background = "rgba(0,20,130," + r + ")"
	jpall.style.color = r < .5 ? "black" : "white"
};

// --

const JAPAN = `
日本	日本	鳥取	石川	富山	青森	北海道
山口	島根	岡山	福井	新潟	秋田	岩手
長崎	福岡	広島	滋賀	長野	山形	宮城
佐賀	大分	兵庫	京都	山梨	群馬	福島

鹿児島	愛媛	香川	和歌山	静岡	東京	茨城
沖縄	高知	徳島	三重	愛知	神奈川	千葉`

const PREF_S = [ '北海道', '青森', '岩手', '宮城', '秋田', '山形', '福島', '茨城', '栃木', '群馬', '埼玉', '千葉', '東京', '神奈川', '新潟', '富山', '石川', '福井', '山梨', '長野', '岐阜', '静岡', '愛知', '三重', '滋賀', '京都', '大阪', '兵庫', '奈良', '和歌山', '鳥取', '島根', '岡山', '広島', '山口', '徳島', '香川', '愛媛', '高知', '福岡', '佐賀', '長崎', '熊本', '大分', '宮崎', '鹿児島', '沖縄' ]

const makeJapanHTML = function() {
	let japan = []
	const japans = JAPAN.trim().split('\n')
	for (let j of japans) {
		japan.push(j.split('\t'))
	}
	let s = []
	s.push('<table id=jp0>')
	let flg = false
	for (let jpn of japan) {
		s.push('<tr>')
		for (let pref of jpn) {
			const n = PREF_S.indexOf(pref)
			if (n < 0) {
				if (!flg) {
					s.push('<td class=pref id=jpall colspan=2>' + pref + '</td>')
					flg = true
				}
			} else {
				s.push('<td class=pref id=jp' + (n + 1) + '>' + pref + '</td>')
			}
		}
		s.push('</tr>')
	}
	s.push('</table>')
	return s.join('')
}
