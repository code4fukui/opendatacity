<script>"use strict";

window.onload = function() {
	var data = {};
	var sum = 0;
	var list = LOCALGOV_JP;
	
	var parseProtocol = function(url) {
		return url.substring(0, url.indexOf("://"));
	};
	
	for (var i = 0; i < list.length; i++) {
		var g = list[i];
		var protocol = parseProtocol(g.url);
		
		if (data[protocol]) {
			data[protocol]++;
		} else {
			data[protocol] = 1;
		}
		sum++;
	}
//		dump(data);
	showCircleGraph(get("canvas"), { data: data, unit: "" });
	showTable(get("tbl"), { data: data, unit: "" });
	get("num").textContent = sum
};

var showTable = function(div, gdata) {
	var data = gdata.data;
	var unit = gdata.unit;
	var d = [];
	var sum = 0;
	for (var n in data) {
		d.push([ n, data[n] ]);
		sum += data[n];
	}
	d = d.sort(function(a, b) {
		if (a[1] < b[1])
			return 1;
		if (a[1] == b[1])
			return 0;
		return -1;
	});
	
	d.push([ "合計", sum ]);
	var tbl = create("table");
	for (var i = 0; i < d.length; i++) {
		var tr = create("tr");
		var td = create("td");
		var s = d[i][0];
		if (s.startsWith("http://") || s.startsWith("https://")) {
			td.innerHTML = "<a href=" + s + " target=_blank>" + s + "</a>";
		} else {
			td.textContent = s;
			td.style.cursor = "hannd";
			td.onclick = function() {
				var name = this.textContent;
				var s = name + "\n";
				for (var i = 0; i < AREA.length; i++) {
					var area = AREA[i];
					if (area[0] == name) {
						for (var j = 1; j < area.length; j++) {
							s += area[j] + " ";
						}
					}
				}
				alert(s);
			};
		}
		tr.appendChild(td);
		td = create("td");
		td.textContent = d[i][1] + unit;
		tr.appendChild(td);
		td = create("td");
		td.textContent = fixfloat(d[i][1] / sum * 100, 1) + "%";
		tr.appendChild(td);
		tbl.appendChild(tr);
	}
	div.appendChild(tbl);
};
var showCircleGraph = function(c, gdata) {
	var data = gdata.data;
	var unit = gdata.unit;
	var g = getContext(c);
	var d = [];
	var sum = 0;
	for (var n in data) {
		d.push([ n, data[n] ]);
		sum += data[n];
	}
//	alert(sum);
	
	d = d.sort(function(a, b) {
		if (a[0] == "その他")
			return 1;
		if (b[0] == "その他")
			return -1;
		if (a[1] < b[1])
			return 1;
		if (a[1] == b[1])
			return 0;
		return -1;
	});
//	dump(d);
	g.setFont = function(sh) {
		this.font = "normal " + sh + "px sans-serif";
	};
	g.fillTextCenter = function(s, x, y) {
		var met = this.measureText(s);
		var sw = met.width;
		this.fillText(s, x - sw / 2, y);
	};
	var timer = null;
	
	var animation = function(t, type) {
		switch (type) {
			case 0:
				return t * t;
			case 1:
				return 1 - (1 - t) * (1 - t);
			default:
				return t;
		}
		return t;
	};
	
	var t = 0;
	g.draw = function() {
		g.setColor(255, 255, 255);
		g.fillRect(0, 0, g.cw, g.ch);
		
		var cx = g.cw / 2;
		var cy = g.ch / 2;
		var r = Math.min(g.cw, g.ch) / 2 * .95;
		
		var max = Math.PI * 2 * animation(t / 100, 1);
		var f = function(dx, dy, s, v) {
			g.translate(dx, dy);
			var th = -Math.PI / 2;
			for (var i = 0; i < d.length; i++) {
				var dth = d[i][1] / sum * max;
				var col = hsv2rgb(0 + 340 / d.length * i, s, v);
				g.setColor(col[0], col[1], col[2]);
				g.beginPath();
				g.moveTo(cx, cy);
				g.arc(cx, cy, r, th, th + dth, false);
				g.lineTo(cx, cy);
				g.closePath();
				g.fill();
				th += dth;
			}
			g.translate(-dx, -dy);
		};
		f(8, 8, .6, .5);
		f(0, 0, .6, 1);

		var fh = 23;
		g.setFont(fh);
//		g.setColor(255, 255, 255);
		g.setColor(0, 0, 0);
		var th = -Math.PI / 2;
		for (var i = 0; i < d.length; i++) {
			var dth = d[i][1] / sum * max;
			var x = cx + Math.cos(th + dth / 2) * r * .7;
			var y = cy + Math.sin(th + dth / 2) * r * .7;
			g.fillTextCenter(d[i][0], x, y - fh / 6);
			g.fillTextCenter(addComma(d[i][1]) + unit, x, y + fh + fh / 6);
			g.fillTextCenter(fixfloat(d[i][1] / sum * 100, 1) + "%", x, y + fh * 2 + fh / 6);
			th += dth;
		}
		g.fillTextCenter("総数", cx, cy - fh / 6);
		g.fillTextCenter(addComma(sum) + unit, cx, cy + fh + fh / 6);
		if (t >= 100) {
			clearInterval(timer);
		}
	};
	g.init();
	if (timer)
		clearInterval(timer);
	timer = setInterval(function() {
		g.draw();
		t++;
	}, 20);
};
var toTable = function(array) {
	var tbl = create("table");
	for (var i = 0; i < array.length; i++) {
		var dd = array[i];
		var tr = create("tr");
		for (var j = 0; j < dd.length; j++) {
			var td = create("td");
			td.textContent = dd[j];
			tr.appendChild(td);
		}
		tbl.appendChild(tr);
	}
	return tbl;
};


</script>
