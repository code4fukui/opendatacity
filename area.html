var LOCALTEST = false;

var getOpenDataCity = function(callback) {
	var head = {
		"name": "http://www.w3.org/2000/01/rdf-schema#label",
		"lat": "http://www.w3.org/2003/01/geo/wgs84_pos#lat",
		"lng": "http://www.w3.org/2003/01/geo/wgs84_pos#long",
		"lod": "http://linkdata.org/property/rdf1s127i#lodfivestar",
		"license": "http://purl.org/dc/terms/license",
		"created": "http://purl.org/dc/terms/1.1/created",
		"description": "http://purl.org/dc/elements/1.1/description",
		"url": null
	};
	var query = "PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>\n"
		+ "select ?url ?name ?lod ?lat ?lng ?created ?description ?license {\n"
		+ "?s rdf:type <http://odp.jig.jp/odp/1.0#OpenDataCity>;\n"
		+ "<http://schema.org/url> ?url;\n"
		+ "<http://www.w3.org/2000/01/rdf-schema#label> ?name;\n"
		+ "<http://purl.org/dc/terms/identifier> ?lod;\n"
		+ "<http://www.w3.org/2003/01/geo/wgs84_pos#lat> ?lat;\n"
		+ "<http://www.w3.org/2003/01/geo/wgs84_pos#long> ?lng;\n"
		+ "<http://purl.org/dc/terms/created> ?created;\n"
		+ "<http://purl.org/dc/terms/license> ?license;\n"
		+ "<http://schema.org/description> ?description.\n"
		+ "filter(lang(?name)='ja')\n"
		+ "}";
	var url = "https://sparql.odp.jig.jp/api/v1/sparql?query=" + encodeURIComponent(query) + "&output=json";
//	prompt(url);
	url += "&callback=" + getCallbackMethod(function(data) {
		//	dump(data.results.bindings);
		callback(sparqlres2rdf(data.results.bindings, head));
	});
	jsonp(url);
	
};
var sparqlres2rdf = function(data, head) {
	var rdf = {};
	for (var i = 0; i < data.length; i++) {
		var d = data[i];
		var url = d.url.value;
		var d2 = {};
		for (var name in d) {
			var n2 = head[name];
			if (n2 != null)
				d2[n2] = [ d[name] ];
		}
		rdf[url] = d2;
	}
	return rdf;
};

	getOpenDataCity(function(rdf) {
//		dump(rdf);
		
		var data = {};

		for (var uri in rdf) {
			var r = rdf[uri];
			var val = r["http://www.w3.org/2000/01/rdf-schema#label"][0].value;
			var areaid = null;
			for (var i = 0; i < AREA.length; i++) {
				var area = AREA[i];

					if (val.startsWith(area[j])) {

						break;
					}
				}
				if (areaid)
					break;
			}
			if (!areaid) {
				dump(r); // err!
			}
			if (data[areaid]) {
				data[areaid]++;
			} else {
				data[areaid] = 1;
			}
			sum++;
		}
//		dump(data);
		showCircleGraph(get("canvas"), { data: data, unit: "" });
		showTable(get("tbl"), { data: data, unit: "" });
		get("num").textContent = sum
	});
};

var showTable = function(div, gdata) {
	var data = gdata.data;
	var unit = gdata.unit;
	var d = [];
	var sum = 0;
	for (var n in data) {
		d.push([ n, data[n] ]);
		sum += data[n];
	}
	d = d.sort(function(a, b) {
		if (a[1] < b[1])
			return 1;
		if (a[1] == b[1])
			return 0;
		return -1;
	});
	
	d.push([ "合計", sum ]);
	var tbl = create("table");
	for (var i = 0; i < d.length; i++) {
		var tr = create("tr");
		var td = create("td");
		var s = d[i][0];
		if (s.startsWith("http://") || s.startsWith("https://")) {
			td.innerHTML = "<a href=" + s + " target=_blank>" + s + "</a>";
		} else {
			td.textContent = s;
			td.style.cursor = "hannd";
			td.onclick = function() {
				var name = this.textContent;
				var s = name + "\n";
				for (var i = 0; i < AREA.length; i++) {
					var area = AREA[i];
					if (area[0] == name) {
						for (var j = 1; j < area.length; j++) {
							s += area[j] + " ";
						}
					}
				}
				alert(s);
			};
		}
		tr.appendChild(td);
		td = create("td");
		td.textContent = d[i][1] + unit;
		tr.appendChild(td);
		td = create("td");
		td.textContent = fixfloat(d[i][1] / sum * 100, 1) + "%";
		tr.appendChild(td);
		tbl.appendChild(tr);
	}
	div.appendChild(tbl);
};
var showCircleGraph = function(c, gdata) {
	var data = gdata.data;
	var unit = gdata.unit;
	var g = getContext(c);
	var d = [];
	var sum = 0;
	for (var n in data) {
		d.push([ n, data[n] ]);
		sum += data[n];
	}
//	alert(sum);
	
	d = d.sort(function(a, b) {
		if (a[0] == "その他")
			return 1;
		if (b[0] == "その他")
			return -1;
		if (a[1] < b[1])
			return 1;
		if (a[1] == b[1])
			return 0;
		return -1;
	});
//	dump(d);
	g.setFont = function(sh) {
		this.font = "normal " + sh + "px sans-serif";
	};
	g.fillTextCenter = function(s, x, y) {
		var met = this.measureText(s);
		var sw = met.width;
		this.fillText(s, x - sw / 2, y);
	};
	var timer = null;
	
	var animation = function(t, type) {
		switch (type) {
			case 0:
				return t * t;
			case 1:
				return 1 - (1 - t) * (1 - t);
			default:
				return t;
		}
		return t;
	};
	
	var t = 0;
	g.draw = function() {
		g.setColor(255, 255, 255);
		g.fillRect(0, 0, g.cw, g.ch);
		
		var cx = g.cw / 2;
		var cy = g.ch / 2;
		var r = Math.min(g.cw, g.ch) / 2 * .95;
		
		var max = Math.PI * 2 * animation(t / 100, 1);
		var f = function(dx, dy, s, v) {
			g.translate(dx, dy);
			var th = -Math.PI / 2;
			for (var i = 0; i < d.length; i++) {
				var dth = d[i][1] / sum * max;
				var col = hsv2rgb(120 + 360 / d.length * i, s, v);
				g.setColor(col[0], col[1], col[2]);
				g.beginPath();
				g.moveTo(cx, cy);
				g.arc(cx, cy, r, th, th + dth, false);
				g.lineTo(cx, cy);
				g.closePath();
				g.fill();
				th += dth;
			}
			g.translate(-dx, -dy);
		};
		f(8, 8, .6, .5);
		f(0, 0, .6, 1);

		var fh = 10;
		g.setFont(fh);
//		g.setColor(255, 255, 255);
		g.setColor(0, 0, 0);
		var th = -Math.PI / 2;
		for (var i = 0; i < d.length; i++) {
			var dth = d[i][1] / sum * max;
			var x = cx + Math.cos(th + dth / 2) * r * .7;
			var y = cy + Math.sin(th + dth / 2) * r * .7;
			g.fillTextCenter(d[i][0], x, y - fh / 6);
			g.fillTextCenter(addComma(d[i][1]) + unit, x, y + fh + fh / 6);
			g.fillTextCenter(fixfloat(d[i][1] / sum * 100, 1) + "%", x, y + fh * 2 + fh / 6);
			th += dth;
		}
		g.fillTextCenter("総数", cx, cy - fh / 6);
		g.fillTextCenter(addComma(sum) + unit, cx, cy + fh + fh / 6);
		if (t >= 100) {
			clearInterval(timer);
		}
	};
	g.init();
	if (timer)
		clearInterval(timer);
	timer = setInterval(function() {
		g.draw();
		t++;
	}, 20);
};
var toTable = function(array) {
	var tbl = create("table");
	for (var i = 0; i < array.length; i++) {
		var dd = array[i];
		var tr = create("tr");
		for (var j = 0; j < dd.length; j++) {
			var td = create("td");
			td.textContent = dd[j];
			tr.appendChild(td);
		}
		tbl.appendChild(tr);
	}
	return tbl;
};
// util
var jsonp = function(url) {
	var head = document.getElementsByTagName("head")[0];
   	var script = document.createElement("script");
    script.setAttribute("src", url);
    script.setAttribute("type", "text/javascript");
//	script.setAttribute("id", 'jsonp');
	head.appendChild(script);
};
var convertCSVtoArray = function(s) {
	var lines = s.split("\n");
	var res = [];
	for (var i = 0; i < lines.length; i++) {
		var ar = lines[i].split(",");
		res.push(ar);
	}
	return res;
};
var getJSON = function(url, callback) {
	if (url.endsWith(".csv")) {
		getRawJSON(url, "SJIS", function(csv) {
			callback(convertCSVtoArray(csv));
		});
	} else if (url.endsWith(".xml")) {
		getXMLJSON(url, callback);
	} else {
		alert("not support type : " + url);
	}
};
var getXMLJSON = function(url, callback) {
	var host = "sabae.cc";
	var cnv = "xml2json";
	var base = "http://" + host + "/proxy/ITqT5WkhCf2yn1s9?cnv=" + cnv;
	var url2 = base + "&cache=no&callback=" + getCallbackMethod(callback) + "&url=" + encodeURI(url);
	jsonp(url2);
};
var getRawJSON = function(url, srcenc, callback) {
	var host = LOCALTEST ? "localhost:8080" : "sabae.cc";
	var cache = "no";
	var base = "http://" + host + "/proxy/ITqT5WkhCf2yn1s9?";
	var url2 = base + "cnv=json&srcenc=" + srcenc + "&cache="  + cache + "&callback=" + getCallbackMethod(callback) + "&url=" + encodeURIComponent(url);
	jsonp(url2);
};
