<script>'use strict'

const fetchJSON = async function(url, enc) {
	return new Promise(resolve => {
		getJSON(url, function(data) {
			resolve(data)
		}, enc)
	})
}
const csv2json = function(csv, key) {
	const data = {}
	const head = csv[0]
	let nkey = 0
	for (let i = 0; i < head.length; i++) {
		if (head[i] == key) {
			nkey = i
			break
		}
	}
	for (let i = 1; i < csv.length; i++) {
		const s = csv[i]
		let val = {}
		for (let j = 0; j < head.length; j++) {
			val[head[j]] = s[j]
		}
		data[s[nkey]] = val
	}
	return data
}

window.onload = async function() {
	const url = 'https://fukuno.jig.jp/app/csv/data/mextgojp-prog-stat-20200109.csv'
	const csv = await fetchJSON(url, 'utf-8')
	const data = csv2json(csv, "PREF")
	const govs = LOCALGOV_JP
	get("japan").innerHTML += makeJapanHTML()
	show(govs, data)
}

let databk
let odcbk

const show = function(govs, odc) {
//	dump(data);
	
	databk = govs
	odcbk = odc
	initData()
}
var compareKana = function(a, b) {
	a = katakanaToHiragana(a.toString())
	b = katakanaToHiragana(b.toString())
	if (a < b) {
		return -1
	} else if (a > b) {
		return 1
	}
	return 0
}
// https://gist.github.com/kawanet/5553478
/** カタカナをひらがなに変換する関数
 * @param {String} src - カタカナ
 * @returns {String} - ひらがな
 */
const katakanaToHiragana = function(src) {
	return src.replace(/[\u30a1-\u30f6]/g, function(match) {
		var chr = match.charCodeAt(0) - 0x60
		return String.fromCharCode(chr)
	})
}
const initData = function() {
	let data = databk
	let odc = odcbk
	console.log(odc)
	const countPref = function(pref) {
		console.log(pref, odc, odc[pref])
		return parseInt(odc[pref].N_LOCAL)
	}
	const countPrefProgEdu = function(pref, ans) {
		return parseInt(odc[pref][ans])
	}
//	dump(data);

	const getContentPref = function(pref) {
		let d2 = []
		for (let i = 0; i < data.length; i++) {
			const dd = data[i]
			if (dd.pref.startsWith(pref)) {
				const url = dd.url
				// const desc = dd.phrase
				if (pref.startsWith("東京都") || !dd.city.endsWith("区"))
					d2.push([ url, dd.city, dd.citykana ]);
			}
		}
		d2.sort(function(n, m) {
			return compareKana(n[2], m[2])
		})
		let s = []
		for (let i = 0; i < d2.length; i++) {
			const d3 = d2[i];
			const od = getCityOpenData(pref + d3[1])
			if (od) {
				s.push("<a href=" + od + "><ruby>" + d3[1] + "<rt>" + d3[2] + "</rt></ruby></a>")
			} else {
				s.push("<ruby>" + d3[1] + "<rt>" + d3[2] + "</rt></ruby>")
			}
		}
		return s.join(", ")
	}
	
	let sum = 0
	let sumodc = 0
	for (let i = 1; i <= 47; i++) {
		const c = get("jp" + i)
		c.num = i - 1
		c.onclick = function() {
			this.sel()
		}
		const cnt = countPref(PREF[i - 1])
		sum += cnt
		let cntod = countPrefProgEdu(PREF[i - 1], "Q4A1")

		sumodc += cntod
		const r = cntod / cnt
		const r2 = (cntod / cnt - .4) / .4
		c.innerHTML += "<br>" + Math.floor(100 * r) + "%"
		if (r == 1)
			c.style.background = "rgba(10,200,100)"
		else
			c.style.background = "rgba(10,60,230," + r2 + ")"
		c.style.color = r2 < .5 ? "black" : "white"
		c.cnt = cnt
		c.cntod = cntod
		c.sel = function() {
			var pref = PREF[this.num]
			var od = getCityOpenData(pref, "")
			if (od) {
				pref = "<a href=" + od + ">" + pref + "</a>"
			}
			get("box").innerHTML = pref + "（" + this.cntod + " / " + this.cnt + "）：" + getContentPref(PREF[this.num])
		}
	}
	
	let s = ''
	s += "市区町村プログラミング教育準備率 " + fixfloat(sumodc / sum * 100, 1) + "%<br>「令和元年度 市町村教育委員会における小学校プログラミング教育に関する取組状況等調査」の問4に「１．各校１人以上の教員が、実践的な研修、または、授業・模擬授業を実施済と把握している」と回答した行政の割合"
	s += "日本の都市数：" + sum + " （都道府県を含まず）<br>"
	get("box").innerHTML = s
	const sjpall = s
	jpall.onclick = function() {
		box.innerHTML = sjpall
	}
	var r = sumodc / sum;
	jpall.innerHTML = "プログラミング教育準備率 " + fixfloat(r * 100, 1) + "%<br>"
	jpall.style.fontSize = "1.7vw"
	//jpall.style.background = "rgba(30,230,10," + r + ")"
	//jpall.style.color = r < .5 ? "black" : "white"
};

const PREF_S = [ '北海道', '青森', '岩手', '宮城', '秋田', '山形', '福島', '茨城', '栃木', '群馬', '埼玉', '千葉', '東京', '神奈川', '新潟', '富山', '石川', '福井', '山梨', '長野', '岐阜', '静岡', '愛知', '三重', '滋賀', '京都', '大阪', '兵庫', '奈良', '和歌山', '鳥取', '島根', '岡山', '広島', '山口', '徳島', '香川', '愛媛', '高知', '福岡', '佐賀', '長崎', '熊本', '大分', '宮崎', '鹿児島', '沖縄' ]

const makeJapanHTML = function() {
	let japan = []
	const japans = JAPAN.trim().split('\n')
	for (let j of japans) {
		japan.push(j.split('\t'))
	}
	let s = []
	s.push('<table id=jp0>')
	let flg = false
	for (let jpn of japan) {
		s.push('<tr>')
		for (let pref of jpn) {
			const n = PREF_S.indexOf(pref)
			if (n < 0) {
				if (!flg) {
					s.push('<td class=pref id=jpall colspan=2>' + pref + '</td>')
					flg = true
				}
			} else {
				s.push('<td class=pref id=jp' + (n + 1) + '>' + pref + '</td>')
			}
		}
		s.push('</tr>')
	}
	s.push('</table>')
	return s.join('')
}
